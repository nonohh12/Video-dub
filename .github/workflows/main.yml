name: 🎬 Win-XS Auto Recapper Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video Link'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Full analysis aur heavy rendering ke liye 2 ghante ka time
    timeout-minutes: 120 

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Deno (Challenge Solver)
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH

      - name: 🐍 Setup Python & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # Force update yt-dlp aur edge-tts
          pip install -U yt-dlp requests edge-tts asyncio

      - name: 🏭 Run Final Boss Pipeline
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        # Is baar ye vision frames scan karke loop-BGM ke sath process karega
        run: python final_pipeline.py <<<'${{ github.event.inputs.video_url }}'

      - name: 📤 Upload Full Narrator Recap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Narrator-Recap
          path: output/final_recap.mp4
          retention-days: 3
          

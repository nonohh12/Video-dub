name: 🎬 Win-XS Auto Recapper Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video Link'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Deno
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH

      - name: 🐍 Setup Python
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp requests edge-tts asyncio

      - name: 🏭 Run Final Pipeline
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        # Command line se remote components enable kar rahe hain taaki koi galti na ho
        run: python final_pipeline.py <<<'${{ github.event.inputs.video_url }}'
        

name: 🎬 Win-XS Auto Recapper Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video Link (Manga Recap)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Full scan aur AI analysis ke liye 2 ghante ka safety margin
    timeout-minutes: 120 

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Deno (Challenge Solver)
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH

      - name: 🐍 Setup Python & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # Latest yt-dlp aur vision support ke liye requests update
          pip install -U yt-dlp requests edge-tts asyncio

      - name: 🏭 Run Intelligent Pipeline
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        # Is baar ye pehle scan karega, phir dub karega
        run: python final_pipeline.py <<<'${{ github.event.inputs.video_url }}'

      - name: 📤 Upload Badass Montage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Smart-Recap
          path: output/final_recap.mp4
          retention-days: 3
          

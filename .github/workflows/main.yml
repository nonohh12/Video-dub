name: 🎬 Win-XS Auto Recapper Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video ka link yahan paste karein'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp requests edge-tts asyncio

      - name: 🏭 Run Final Pipeline
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        # Inputs ko script ke stdin mein pass kar rahe hain
        run: python final_pipeline.py <<<'${{ github.event.inputs.video_url }}'

      - name: 📤 Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Final-Recap-Video
          path: output/final_recap.mp4
          

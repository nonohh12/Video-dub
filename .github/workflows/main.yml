name: 🎬 Win-XS Auto Recapper Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video ka link yahan paste karein'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Deno (Better Challenge Solver)
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH

      - name: 🐍 Setup Python & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # Latest yt-dlp install karna zaruri hai
          pip install -U yt-dlp requests edge-tts asyncio

      - name: 🏭 Run Final Pipeline
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        # Hum yahan explicit remote components flag pass kar rahe hain
        run: python final_pipeline.py <<<'${{ github.event.inputs.video_url }}'

      - name: 📤 Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Final-Recap-Video
          path: output/final_recap.mp4
          

name: 🎬 Win-XS Auto Recapper Pro
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Link'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🟢 Setup Deno
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "/home/runner/.deno/bin" >> $GITHUB_PATH
      - name: 🐍 Setup Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp requests edge-tts asyncio
      - name: 🏭 Run Pipeline
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python final_pipeline.py <<<'${{ github.event.inputs.video_url }}'
      - name: 📤 Get Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2-Min-Recap
          path: output/final_recap.mp4
          
